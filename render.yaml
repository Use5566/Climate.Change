services:
  - type: web
    name: student-ai-learning
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: LEARNING_STORAGE
        value: google_sheets
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
